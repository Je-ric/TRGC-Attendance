<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance — Church Attendance</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon_io/favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon_io/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_io/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon_io/apple-touch-icon.png" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="attendance-page">

  <div class="main-wrap">

    <!-- Hero Banner -->
    <header class="hero-banner has-banner-image">
      <div aria-hidden="true">
        <div class="hero-glow hero-glow-a"></div>
        <div class="hero-glow hero-glow-b"></div>
      </div>
      <div class="hero-banner-inner">
        <div class="hero-top-row">
          <div class="hero-brand">
            <img src="assets/img/TRGC-Logo.png" alt="TRGC Logo" class="hero-logo" />
            <div>
              <p class="hero-brand-title">TRGC Attendance</p>
              <p class="hero-brand-sub">Church Management</p>
            </div>
          </div>
          <div class="hero-meta">
            <div class="hero-clock">
              <p id="heroClock">--:--:--</p>
              <p id="heroClockDate" class="hero-date">Loading...</p>
            </div>
          </div>
        </div>
        <div class="hero-greeting-section">
          <p class="hero-eyebrow" id="heroDate">Loading...</p>
          <h1 class="hero-greeting" id="heroGreeting" aria-label="Good Morning, Ka-TRGC">
            <span aria-hidden="true"><span class="accent">Good Morning</span>, Ka-TRGC</span>
          </h1>
        </div>
        <div class="hero-nav-scroll">
          <nav class="hero-nav" aria-label="Main navigation">
            <div class="hero-nav-glide"></div>
            <a href="index.html"      class="hero-nav-link"><i class='bx bxs-dashboard'></i> Dashboard</a>
            <a href="events.html"     class="hero-nav-link"><i class='bx bx-calendar-event'></i> Events</a>
            <a href="attendance.html" class="hero-nav-link active" aria-current="page"><i class='bx bx-check-square'></i> Attendance</a>
            <a href="people.html"     class="hero-nav-link"><i class='bx bx-group'></i> People</a>
            <a href="families.html"   class="hero-nav-link"><i class='bx bx-home-heart'></i> Families</a>
            <a href="reports.html"    class="hero-nav-link"><i class='bx bx-bar-chart-alt-2'></i> Reports</a>
          </nav>
        </div>
      </div>
    </header>

    <!-- Actions bar -->
    <div class="actions-bar">
      <button onclick="exportAttendance()" id="exportBtn" class="btn btn-outline btn-sm" disabled><i class='bx bx-download'></i> Export</button>
    </div>

    <!-- Session selector bar -->
    <div class="filter-bar" style="gap:0.75rem;align-items:flex-end">
      <div>
        <label class="form-label">Session</label>
        <select id="sessionSelect" class="form-input" style="width:320px" onchange="loadSession()">
          <option value="">— Select a session —</option>
        </select>
      </div>
      <div>
        <label class="form-label">Filter by Date</label>
        <input id="dateFilter" type="date" class="form-input" style="width:160px" onchange="filterSessionList()" />
      </div>
      <a href="events.html" class="btn btn-outline" style="margin-bottom:1px"><i class='bx bx-plus'></i> New Session</a>
    </div>

    <!-- Session info bar (hidden until session selected) -->
    <div id="sessionInfo" class="session-info-bar" style="display:none"></div>

    <main class="page-content">

      <!-- Empty state -->
      <div id="emptyState" class="empty-state" style="flex:1">
        <i class='bx bx-check-square'></i>
        <p>Select a session above to take or view attendance.</p>
      </div>

      <!-- Attendance panel -->
      <div id="attendancePanel" class="page-content attendance-panel" style="display:none">

        <!-- Count cards -->
        <div class="count-grid">
          <div class="count-card">
            <p class="count-label">Present</p>
            <p id="countPresent" class="count-value red">0</p>
          </div>
          <div class="count-card">
            <p class="count-label">Absent</p>
            <p id="countAbsent" class="count-value grey">0</p>
          </div>
          <div class="count-card">
            <p class="count-label">Not Marked</p>
            <p id="countUnmarked" class="count-value" style="color:var(--border)">0</p>
          </div>
          <div class="count-card">
            <p class="count-label">Total People</p>
            <p id="countTotal" class="count-value black">0</p>
          </div>
        </div>

        <!-- Controls -->
        <div style="display:flex;flex-wrap:wrap;gap:0.625rem;align-items:center">
          <div class="search-wrap">
            <i class='bx bx-search'></i>
            <input id="peopleSearch" type="text" placeholder="Search person…" oninput="debouncedRender()" />
          </div>
          <select id="filterCat" class="form-input" style="width:auto" onchange="renderPeopleList()">
            <option value="">All Categories</option>
            <option>Kids</option><option>Youth</option><option>Adults</option><option>Seniors</option>
          </select>
          <select id="filterStatus" class="form-input" style="width:auto" onchange="renderPeopleList()">
            <option value="">All Statuses</option>
            <option>Member</option><option>Regular Attendee</option><option>Visitor</option><option>Inactive</option>
          </select>
          <select id="filterGender" class="form-input" style="width:auto" onchange="renderPeopleList()">
            <option value="">All Genders</option>
            <option>Male</option><option>Female</option>
          </select>
          <button onclick="markAll('present')" class="btn btn-outline btn-sm"><i class='bx bx-check'></i> Mark All Present</button>
          <button onclick="markAll('absent')"  class="btn btn-ghost btn-sm"><i class='bx bx-x'></i> Mark All Absent</button>
          <button onclick="clearAll()" class="btn btn-ghost btn-sm" style="color:var(--grey)"><i class='bx bx-reset'></i> Clear All</button>
          <button onclick="saveAttendance()" id="saveBtn" class="btn btn-primary" style="margin-left:auto">
            <i class='bx bx-save'></i> Save Attendance
          </button>
        </div>

        <!-- People table -->
        <div class="panel">
          <div class="table-scroll">
            <table class="data-table attendance-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th style="text-align:center;width:90px">Attendance</th>
                  <th>Notes / Remarks</th>
                </tr>
              </thead>
              <tbody id="peopleBody"></tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/export.js"></script>
  <script>
    initHeroBanner();
    const debouncedRender = debounce(renderPeopleList, 250);
    let allSessions = [];
    let allPeople = [];
    let existingRecords = {};
    let attendance = {};
    let currentSessionId = null;

    async function init() {
      const [{ data: sessions, error: sessionsError }, { data: people, error: peopleError }] = await Promise.all([
        db.from('attendance_sessions')
          .select('id, date, service_name, attendance_types(name)')
          .order('date', { ascending: false }),
        db.from('people')
          .select('id, first_name, last_name, birthdate, category, membership_status, gender')
          .order('last_name').order('first_name'),
      ]);
      if (sessionsError || peopleError) {
        showToast(sessionsError?.message || peopleError?.message || 'Unable to load attendance data.', 'error');
        return;
      }
      allSessions = sessions || [];
      allPeople = people || [];
      populateSessionSelect();

      const urlSession = new URLSearchParams(location.search).get('session');
      if (urlSession) {
        document.getElementById('sessionSelect').value = urlSession;
        loadSession();
      }
    }

    function populateSessionSelect(filtered = null) {
      const sel = document.getElementById('sessionSelect');
      const current = sel.value;
      const list = filtered ?? allSessions;
      sel.innerHTML = '<option value="">— Select a session —</option>';
      list.forEach(s => {
        const o = document.createElement('option');
        o.value = s.id;
        o.textContent = `${formatDate(s.date)} — ${s.attendance_types?.name ?? '?'}${s.service_name ? ' · ' + s.service_name : ''}`;
        sel.appendChild(o);
      });
      if (current) sel.value = current;
    }

    function filterSessionList() {
      const d = document.getElementById('dateFilter').value;
      populateSessionSelect(d ? allSessions.filter(s => s.date === d) : allSessions);
    }

    async function loadSession() {
      const id = document.getElementById('sessionSelect').value;
      const emptyState = document.getElementById('emptyState');
      const panel = document.getElementById('attendancePanel');
      const infoBar = document.getElementById('sessionInfo');

      if (!id) {
        currentSessionId = null;
        emptyState.style.display = 'flex';
        panel.style.display = 'none';
        infoBar.style.display = 'none';
        document.getElementById('exportBtn').disabled = true;
        return;
      }

      currentSessionId = id;
      const session = allSessions.find(s => s.id === id);

      infoBar.style.display = 'flex';
      infoBar.innerHTML = `
        <i class='bx bx-calendar-check'></i>
        <strong>${session?.attendance_types?.name ?? '—'}</strong>
        ${session?.service_name ? `<span class="sep">·</span> <span>${session.service_name}</span>` : ''}
        <span class="sep">|</span>
        <span>${formatDate(session?.date)} — ${dayOfWeek(session?.date)}</span>
      `;

      const { data: records, error } = await db
        .from('attendance_records')
        .select('id, person_id, status, remarks')
        .eq('attendance_session_id', id);

      if (error) {
        showToast(error.message || 'Unable to load this session.', 'error');
        return;
      }

      existingRecords = {};
      (records || []).forEach(r => { existingRecords[r.person_id] = r; });

      attendance = {};
      allPeople.forEach(p => {
        const rec = existingRecords[p.id];
        attendance[p.id] = { status: rec?.status ?? null, remarks: rec?.remarks ?? '' };
      });

      emptyState.style.display = 'none';
      panel.style.display = 'flex';
      panel.style.flexDirection = 'column';
      panel.style.gap = '1.25rem';
      renderPeopleList();
      
      // Enable export button when session is loaded
      document.getElementById('exportBtn').disabled = false;
    }

    function filteredPeople() {
      const q = document.getElementById('peopleSearch').value.toLowerCase();
      const cat = document.getElementById('filterCat').value;
      const st = document.getElementById('filterStatus').value;
      const gender = document.getElementById('filterGender').value;
      return allPeople.filter(p => {
        const name = `${p.first_name} ${p.last_name}`.toLowerCase();
        const ec = effectiveCategory(p);
        return (!q || name.includes(q)) && (!cat || ec === cat) && (!st || p.membership_status === st) && (!gender || p.gender === gender);
      });
    }

    function renderPeopleList() {
      const people = filteredPeople();
      const tbody = document.getElementById('peopleBody');

      if (!people.length) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;padding:2.5rem;color:var(--grey)">No people found.</td></tr>`;
        updateCounts();
        return;
      }

      tbody.innerHTML = people.map(p => {
        const att = attendance[p.id] || { status: null, remarks: '' };
        const rowStyle = att.status === 'present' ? 'background:#fef9f9' : att.status === 'absent' ? 'background:#f9f9f9' : '';

        return `<tr id="row-${p.id}" data-status="${att.status || ''}" style="${rowStyle}">
          <td class="attendance-name">${genderDot(p.gender)}<span>${escapeHtml(p.last_name)}, ${escapeHtml(p.first_name)}</span></td>
          <td style="text-align:center">
            <div class="att-toggle">
              <button type="button" class="att-btn present ${att.status === 'present' ? 'active' : ''}" aria-label="Mark present" aria-pressed="${att.status === 'present'}" onclick="setStatus('${p.id}', 'present')"><i class='bx bx-check'></i></button>
              <button type="button" class="att-btn absent ${att.status === 'absent' ? 'active' : ''}" aria-label="Mark absent" aria-pressed="${att.status === 'absent'}" onclick="setStatus('${p.id}', 'absent')"><i class='bx bx-x'></i></button>
            </div>
          </td>
          <td>
            <input type="text" value="${escapeHtml(att.remarks || '')}"
              placeholder="Add a note…"
              aria-label="Notes for ${escapeHtml(p.first_name)} ${escapeHtml(p.last_name)}"
              oninput="setRemarks('${p.id}', this.value)"
              class="remarks-input" />
          </td>
        </tr>`;
      }).join('');

      updateCounts();
    }

    function setStatus(personId, status) {
      if (!attendance[personId]) attendance[personId] = { status: null, remarks: '' };
      attendance[personId].status = attendance[personId].status === status ? null : status;
      updateCounts();
      updateRowUI(personId, attendance[personId].status);
    }

    function updateRowUI(personId, status) {
      const row = document.getElementById(`row-${personId}`);
      if (!row) return;
      row.dataset.status = status || '';
      row.style.background = status === 'present' ? '#fef9f9' : status === 'absent' ? '#f9f9f9' : '';
      const [presentBtn, absentBtn] = row.querySelectorAll('.att-btn');
      presentBtn.classList.toggle('active', status === 'present');
      absentBtn.classList.toggle('active', status === 'absent');
      presentBtn.setAttribute('aria-pressed', String(status === 'present'));
      absentBtn.setAttribute('aria-pressed', String(status === 'absent'));
    }

    function setRemarks(personId, value) {
      if (!attendance[personId]) attendance[personId] = { status: null, remarks: '' };
      attendance[personId].remarks = value;
    }

    function markAll(status) {
      filteredPeople().forEach(p => {
        attendance[p.id] = { ...(attendance[p.id] || {}), status };
        updateRowUI(p.id, status);
      });
      updateCounts();
    }

    function clearAll() {
      filteredPeople().forEach(p => {
        attendance[p.id] = { ...(attendance[p.id] || {}), status: null };
        updateRowUI(p.id, null);
      });
      updateCounts();
    }

    function updateCounts() {
      const vals = Object.values(attendance);
      document.getElementById('countPresent').textContent  = vals.filter(a => a.status === 'present').length;
      document.getElementById('countAbsent').textContent   = vals.filter(a => a.status === 'absent').length;
      document.getElementById('countUnmarked').textContent = vals.filter(a => !a.status).length;
      document.getElementById('countTotal').textContent    = allPeople.length;
    }

    async function saveAttendance() {
      if (!currentSessionId) return;
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class=\'bx bx-loader-alt bx-spin\'></i> Saving…';

      const toInsert = [];
      const toUpdate = [];
      const toDelete = [];

      allPeople.forEach(p => {
        const att = attendance[p.id];
        const existing = existingRecords[p.id];
        if (att?.status) {
          if (existing) {
            toUpdate.push({
              id: existing.id,
              attendance_session_id: currentSessionId,
              person_id: p.id,
              status: att.status,
              remarks: att.remarks || null,
            });
          } else {
            toInsert.push({
              attendance_session_id: currentSessionId,
              person_id: p.id,
              status: att.status,
              remarks: att.remarks || null,
            });
          }
        } else if (existing) {
          toDelete.push(existing.id);
        }
      });

      const BATCH_SIZE = 100; // Process records in batches to avoid size limits
      const ops = [];

      // Batch insert operations
      for (let i = 0; i < toInsert.length; i += BATCH_SIZE) {
        const batch = toInsert.slice(i, i + BATCH_SIZE);
        if (batch.length) ops.push(db.from('attendance_records').insert(batch));
      }

      // Batch update operations  
      for (let i = 0; i < toUpdate.length; i += BATCH_SIZE) {
        const batch = toUpdate.slice(i, i + BATCH_SIZE);
        if (batch.length) ops.push(db.from('attendance_records').upsert(batch, { onConflict: 'id' }));
      }

      // Batch delete operations
      for (let i = 0; i < toDelete.length; i += BATCH_SIZE) {
        const batch = toDelete.slice(i, i + BATCH_SIZE);
        if (batch.length) ops.push(db.from('attendance_records').delete().in('id', batch));
      }

      const results = await Promise.all(ops);
      const err = results.find(r => r.error);

      btn.disabled = false;
      btn.innerHTML = '<i class=\'bx bx-save\'></i> Save Attendance';

      if (err) { showToast(err.error.message, 'error'); return; }
      showToast('Attendance saved.');
      await loadSession();
    }

    async function exportAttendance() {
      if (!currentSessionId) {
        showToast('Please select a session first', 'warning');
        return;
      }

      const btn = document.getElementById('exportBtn');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class=\'bx bx-loader-alt bx-spin\'></i> Exporting…';

      try {
        const session = allSessions.find(s => s.id === currentSessionId);
        
        // Build attendance data from existing attendance object and allPeople
        const attendanceData = allPeople.map(person => ({
          status: attendance[person.id]?.status || 'unmarked',
          remarks: attendance[person.id]?.remarks || '',
          person
        }));
        
        if (attendanceData.length === 0) {
          showToast('No attendance data to export', 'warning');
          return;
        }
        
        await exportAttendanceToCSV(session, attendanceData);
      } catch (error) {
        showToast('Export failed: ' + error.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

    init();
  </script>
</body>
</html>
