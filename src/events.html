<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events &amp; Services — Church Attendance</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <style>
    .tab-btn {
      padding: 0.375rem 1rem;
      border-radius: var(--radius);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 1.5px solid var(--border);
      background: var(--white);
      color: var(--grey);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .tab-btn.active { background: var(--black); color: var(--white); border-color: var(--black); }
    .tab-btn:hover:not(.active) { border-color: var(--black); color: var(--black); }

    .check-row { display: flex; align-items: center; gap: 0.5rem; }
    .check-row input[type="checkbox"] { width: 1rem; height: 1rem; accent-color: var(--red); cursor: pointer; }
    .check-row label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--black); cursor: pointer; margin: 0; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-brand">
      <p class="sidebar-brand-eyebrow">TRGC</p>
      <h1 class="sidebar-brand-name">Attendance<span>.</span></h1>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html"      class="nav-link"><i class='bx bxs-dashboard'></i> Dashboard</a>
      <a href="events.html"     class="nav-link active"><i class='bx bx-calendar-event'></i> Events &amp; Services</a>
      <a href="attendance.html" class="nav-link"><i class='bx bx-check-square'></i> Attendance</a>
      <a href="people.html"     class="nav-link"><i class='bx bx-group'></i> People</a>
      <a href="families.html"   class="nav-link"><i class='bx bx-home-heart'></i> Families</a>
      <a href="reports.html"    class="nav-link"><i class='bx bx-bar-chart-alt-2'></i> Reports</a>
    </nav>
    <div class="sidebar-footer">© 2026 Church Attendance</div>
  </aside>

  <div class="main-wrap">

    <header class="topbar">
      <button class="topbar-hamburger" onclick="openSidebar()" aria-label="Open menu"><i class='bx bx-menu'></i></button>
      <div style="display:flex;gap:0.5rem">
        <button id="tabTypes"    onclick="switchTab('types')"    class="tab-btn active">Service Types</button>
        <button id="tabSessions" onclick="switchTab('sessions')" class="tab-btn">Sessions</button>
      </div>
      <div id="headerActions"></div>
    </header>

    <main class="page-content">

      <!-- Service Types panel -->
      <div id="panelTypes" class="panel">
        <div style="overflow-x:auto">
          <table class="data-table">
            <thead>
              <tr><th>Name</th><th>Day</th><th>Time</th><th>Location</th><th>Recurring</th><th>Status</th><th style="width:90px"></th></tr>
            </thead>
            <tbody id="typesBody">
              <tr><td colspan="7" style="text-align:center;padding:3rem;color:var(--grey)">
                <i class='bx bx-loader-alt bx-spin' style="font-size:1.5rem"></i>
              </td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Sessions panel -->
      <div id="panelSessions" style="display:none;flex-direction:column;gap:1.25rem">
        <div class="panel">
          <div class="filter-bar" style="border-bottom:none;padding:0.75rem 1rem">
            <div class="search-wrap">
              <i class='bx bx-search'></i>
              <input id="sessionSearch" type="text" placeholder="Search service or label…" />
            </div>
            <input id="sessionDateFilter" type="date" class="form-input" style="width:auto" />
            <span id="sessionCountLabel" style="margin-left:auto;font-size:0.6875rem;color:var(--grey);letter-spacing:0.06em;text-transform:uppercase;font-weight:700"></span>
          </div>
          <div style="overflow-x:auto">
            <table class="data-table">
              <thead>
                <tr><th>Date</th><th>Day</th><th>Service</th><th>Sub-label</th><th>Records</th><th style="width:130px"></th></tr>
              </thead>
              <tbody id="sessionsBody">
                <tr><td colspan="6" style="text-align:center;padding:3rem;color:var(--grey)">
                  <i class='bx bx-loader-alt bx-spin' style="font-size:1.5rem"></i>
                </td></tr>
              </tbody>
            </table>
          </div>
          <div id="sessionPagination"></div>
        </div>
      </div>

    </main>
  </div>

  <!-- Service Type Modal -->
  <dialog id="typeModal">
    <div class="modal-header">
      <span id="typeModalTitle" class="modal-title">Add Service Type</span>
      <button onclick="closeModal('typeModal')" class="modal-close"><i class='bx bx-x'></i></button>
    </div>
    <form id="typeForm" onsubmit="saveType(event)">
      <div class="modal-body">
        <input type="hidden" id="typeId" />
        <div class="space-y-3">
          <div>
            <label class="form-label">Name <span style="color:var(--red)">*</span></label>
            <input id="tName" class="form-input" required placeholder="e.g. Sunday Morning Service" />
          </div>
          <div>
            <label class="form-label">Description</label>
            <input id="tDesc" class="form-input" />
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
            <div>
              <label class="form-label">Day of Week</label>
              <select id="tDay" class="form-input">
                <option value="">—</option>
                <option>Sunday</option><option>Monday</option><option>Tuesday</option>
                <option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option>
              </select>
            </div>
            <div>
              <label class="form-label">Start Time</label>
              <input id="tTime" type="time" class="form-input" />
            </div>
          </div>
          <div>
            <label class="form-label">Location</label>
            <input id="tLocation" class="form-input" />
          </div>
          <div style="display:flex;gap:1.5rem;padding-top:0.25rem">
            <div class="check-row">
              <input id="tRecurring" type="checkbox" checked />
              <label for="tRecurring">Recurring</label>
            </div>
            <div class="check-row">
              <input id="tActive" type="checkbox" checked />
              <label for="tActive">Active</label>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" onclick="closeModal('typeModal')" class="btn btn-ghost">Cancel</button>
        <button id="typeSaveBtn" type="submit" class="btn btn-primary"><i class='bx bx-save'></i> Save</button>
      </div>
    </form>
  </dialog>

  <!-- Session Modal -->
  <dialog id="sessionModal">
    <div class="modal-header">
      <span id="sessionModalTitle" class="modal-title">Create Session</span>
      <button onclick="closeModal('sessionModal')" class="modal-close"><i class='bx bx-x'></i></button>
    </div>
    <form id="sessionForm" onsubmit="saveSession(event)">
      <div class="modal-body">
        <input type="hidden" id="sessionId" />
        <div class="space-y-3">
          <div>
            <label class="form-label">Service Type <span style="color:var(--red)">*</span></label>
            <select id="sTypeId" class="form-input" required></select>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
            <div>
              <label class="form-label">Date <span style="color:var(--red)">*</span></label>
              <input id="sDate" type="date" class="form-input" required />
            </div>
            <div>
              <label class="form-label">Sub-label / Sermon Title</label>
              <input id="sServiceName" class="form-input" placeholder="e.g. Baptism Sunday" />
            </div>
          </div>
          <div>
            <label class="form-label">Notes</label>
            <textarea id="sNotes" class="form-input" rows="2"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" onclick="closeModal('sessionModal')" class="btn btn-ghost">Cancel</button>
        <button id="sessionSaveBtn" type="submit" class="btn btn-primary"><i class='bx bx-save'></i> Save</button>
      </div>
    </form>
  </dialog>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script>
    function openSidebar()  { document.querySelector('.sidebar').classList.add('open'); document.getElementById('sidebarOverlay').classList.add('open'); document.body.classList.add('sidebar-open'); }
    function closeSidebar() { document.querySelector('.sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('open'); document.body.classList.remove('sidebar-open'); }
    let activeTab = 'types';
    let allTypes = [];
    let allSessions = [];
    let sessionPage = 1;
    const SESSION_PAGE_SIZE = 15;

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('panelTypes').style.display    = tab === 'types'    ? 'block' : 'none';
      document.getElementById('panelSessions').style.display = tab === 'sessions' ? 'flex'  : 'none';
      document.getElementById('tabTypes').classList.toggle('active', tab === 'types');
      document.getElementById('tabSessions').classList.toggle('active', tab === 'sessions');
      renderHeaderActions();
    }

    function renderHeaderActions() {
      const c = document.getElementById('headerActions');
      if (activeTab === 'types') {
        c.innerHTML = `<button onclick="openTypeModal()" class="btn btn-primary"><i class='bx bx-plus'></i> Add Service Type</button>`;
      } else {
        c.innerHTML = `<button onclick="openSessionModal()" class="btn btn-primary"><i class='bx bx-plus'></i> Create Session</button>`;
      }
    }

    // ── Service Types ─────────────────────────────────────────
    async function loadTypes() {
      const { data } = await db.from('attendance_types').select('*').order('name');
      allTypes = data || [];
      renderTypes();
      populateTypeSelect();
    }

    function renderTypes() {
      const tbody = document.getElementById('typesBody');
      if (!allTypes.length) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:3rem;color:var(--grey)">
          <i class='bx bx-calendar-x' style="font-size:2rem;display:block;margin-bottom:0.5rem;color:var(--border)"></i>
          No service types yet.
        </td></tr>`;
        return;
      }
      tbody.innerHTML = allTypes.map(t => `<tr>
        <td style="font-weight:600">${t.name}</td>
        <td style="color:var(--grey)">${t.day_of_week || '—'}</td>
        <td style="color:var(--grey)">${t.start_time || '—'}</td>
        <td style="color:var(--grey)">${t.location || '—'}</td>
        <td>${t.is_recurring
          ? `<i class='bx bx-check-circle' style="color:var(--red);font-size:1rem"></i>`
          : `<i class='bx bx-minus-circle' style="color:var(--grey);font-size:1rem"></i>`}
        </td>
        <td>${t.is_active
          ? badge('Active', 'background:#1A1A1A;color:#fff')
          : badge('Inactive', 'background:#f3f4f6;color:#6b7280')}
        </td>
        <td>
          <div style="display:flex;gap:0.25rem;justify-content:flex-end">
            <button onclick="editType('${t.id}')" class="btn btn-ghost btn-sm" title="Edit"><i class='bx bx-edit'></i></button>
            <button onclick="deleteType('${t.id}', '${t.name.replace(/'/g, "\\'")}')" class="btn btn-sm" style="background:var(--light);border:1px solid var(--border);color:var(--red)" title="Delete"><i class='bx bx-trash'></i></button>
          </div>
        </td>
      </tr>`).join('');
    }

    function openTypeModal(id) {
      document.getElementById('typeModalTitle').textContent = id ? 'Edit Service Type' : 'Add Service Type';
      document.getElementById('typeForm').reset();
      document.getElementById('typeId').value = id || '';
      if (id) {
        const t = allTypes.find(x => x.id === id);
        if (t) {
          document.getElementById('tName').value = t.name;
          document.getElementById('tDesc').value = t.description || '';
          document.getElementById('tDay').value = t.day_of_week || '';
          document.getElementById('tTime').value = t.start_time || '';
          document.getElementById('tLocation').value = t.location || '';
          document.getElementById('tRecurring').checked = t.is_recurring;
          document.getElementById('tActive').checked = t.is_active;
        }
      }
      openModal('typeModal');
    }

    function editType(id) { openTypeModal(id); }

    async function saveType(e) {
      e.preventDefault();
      const btn = document.getElementById('typeSaveBtn');
      btn.disabled = true; btn.innerHTML = `<i class='bx bx-loader-alt bx-spin'></i> Saving…`;
      const id = document.getElementById('typeId').value;
      const payload = {
        name:         document.getElementById('tName').value.trim(),
        description:  document.getElementById('tDesc').value.trim() || null,
        day_of_week:  document.getElementById('tDay').value || null,
        start_time:   document.getElementById('tTime').value || null,
        location:     document.getElementById('tLocation').value.trim() || null,
        is_recurring: document.getElementById('tRecurring').checked,
        is_active:    document.getElementById('tActive').checked,
      };
      const { error } = id
        ? await db.from('attendance_types').update(payload).eq('id', id)
        : await db.from('attendance_types').insert(payload);
      btn.disabled = false; btn.innerHTML = `<i class='bx bx-save'></i> Save`;
      if (error) { showToast(error.message, 'error'); return; }
      showToast(id ? 'Service type updated.' : 'Service type added.');
      closeModal('typeModal');
      loadTypes();
    }

    async function deleteType(id, name) {
      if (!confirmDelete(`Delete "${name}"? All its sessions and attendance records will be deleted.`)) return;
      const { error } = await db.from('attendance_types').delete().eq('id', id);
      if (error) { showToast(error.message, 'error'); return; }
      showToast('Service type deleted.');
      loadTypes();
    }

    // ── Sessions ──────────────────────────────────────────────
    async function loadSessions() {
      const { data } = await db
        .from('attendance_sessions')
        .select('*, attendance_types(name), attendance_records(id)')
        .order('date', { ascending: false });
      allSessions = data || [];
      renderSessions();
    }

    function filteredSessions() {
      const q = document.getElementById('sessionSearch').value.toLowerCase();
      const d = document.getElementById('sessionDateFilter').value;
      return allSessions.filter(s =>
        (!q || s.attendance_types?.name?.toLowerCase().includes(q) || s.service_name?.toLowerCase().includes(q))
        && (!d || s.date === d)
      );
    }

    function renderSessions() {
      const data = filteredSessions();
      const totalPages = Math.max(1, Math.ceil(data.length / SESSION_PAGE_SIZE));
      if (sessionPage > totalPages) sessionPage = 1;
      const slice = data.slice((sessionPage - 1) * SESSION_PAGE_SIZE, sessionPage * SESSION_PAGE_SIZE);

      const lbl = document.getElementById('sessionCountLabel');
      if (lbl) lbl.textContent = `${data.length} session${data.length !== 1 ? 's' : ''}`;

      const tbody = document.getElementById('sessionsBody');
      if (!slice.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:3rem;color:var(--grey)">
          <i class='bx bx-calendar-x' style="font-size:2rem;display:block;margin-bottom:0.5rem;color:var(--border)"></i>
          No sessions found.
        </td></tr>`;
      } else {
        tbody.innerHTML = slice.map(s => `<tr>
          <td style="font-weight:600">${formatDate(s.date)}</td>
          <td style="color:var(--grey)">${dayOfWeek(s.date)}</td>
          <td>${s.attendance_types?.name ?? '—'}</td>
          <td style="color:var(--grey)">${s.service_name || '—'}</td>
          <td>
            <span style="font-size:0.75rem;font-weight:700;color:var(--red)">${s.attendance_records?.length ?? 0}</span>
            <span style="font-size:0.6875rem;color:var(--grey)"> records</span>
          </td>
          <td>
            <div style="display:flex;gap:0.25rem;justify-content:flex-end">
              <a href="attendance.html?session=${s.id}" class="btn btn-ghost btn-sm" title="Take Attendance"><i class='bx bx-check-square'></i></a>
              <button onclick="editSession('${s.id}')" class="btn btn-ghost btn-sm" title="Edit"><i class='bx bx-edit'></i></button>
              <button onclick="deleteSession('${s.id}', '${(s.attendance_types?.name ?? '').replace(/'/g, "\\'")}', '${s.date}')" class="btn btn-sm" style="background:var(--light);border:1px solid var(--border);color:var(--red)" title="Delete"><i class='bx bx-trash'></i></button>
            </div>
          </td>
        </tr>`).join('');
      }
      renderPagination(document.getElementById('sessionPagination'), sessionPage, totalPages, p => { sessionPage = p; renderSessions(); });
    }

    function populateTypeSelect() {
      const sel = document.getElementById('sTypeId');
      sel.innerHTML = '<option value="">— Select service type —</option>';
      allTypes.filter(t => t.is_active).forEach(t => {
        const o = document.createElement('option');
        o.value = t.id; o.textContent = t.name;
        sel.appendChild(o);
      });
    }

    function openSessionModal() {
      document.getElementById('sessionModalTitle').textContent = 'Create Session';
      document.getElementById('sessionForm').reset();
      document.getElementById('sessionId').value = '';
      document.getElementById('sDate').value = todayISO();
      openModal('sessionModal');
    }

    function editSession(id) {
      const s = allSessions.find(x => x.id === id);
      if (!s) return;
      document.getElementById('sessionModalTitle').textContent = 'Edit Session';
      document.getElementById('sessionId').value = s.id;
      document.getElementById('sTypeId').value = s.attendance_type_id;
      document.getElementById('sDate').value = s.date;
      document.getElementById('sServiceName').value = s.service_name || '';
      document.getElementById('sNotes').value = s.notes || '';
      openModal('sessionModal');
    }

    async function saveSession(e) {
      e.preventDefault();
      const btn = document.getElementById('sessionSaveBtn');
      btn.disabled = true; btn.innerHTML = `<i class='bx bx-loader-alt bx-spin'></i> Saving…`;
      const id = document.getElementById('sessionId').value;
      const payload = {
        attendance_type_id: document.getElementById('sTypeId').value,
        date:               document.getElementById('sDate').value,
        service_name:       document.getElementById('sServiceName').value.trim() || null,
        notes:              document.getElementById('sNotes').value.trim() || null,
      };
      const { error } = id
        ? await db.from('attendance_sessions').update(payload).eq('id', id)
        : await db.from('attendance_sessions').insert(payload);
      btn.disabled = false; btn.innerHTML = `<i class='bx bx-save'></i> Save`;
      if (error) { showToast(error.message, 'error'); return; }
      showToast(id ? 'Session updated.' : 'Session created.');
      closeModal('sessionModal');
      loadSessions();
    }

    async function deleteSession(id, name, date) {
      if (!confirmDelete(`Delete session "${name}" on ${date}? All attendance records will be deleted.`)) return;
      const { error } = await db.from('attendance_sessions').delete().eq('id', id);
      if (error) { showToast(error.message, 'error'); return; }
      showToast('Session deleted.');
      loadSessions();
    }

    // Init
    document.getElementById('sessionSearch').addEventListener('input', debounce(() => { sessionPage = 1; renderSessions(); }));
    document.getElementById('sessionDateFilter').addEventListener('change', () => { sessionPage = 1; renderSessions(); });

    if (new URLSearchParams(location.search).get('action') === 'create') {
      window.addEventListener('load', () => openTypeModal());
    }

    renderHeaderActions();
    loadTypes();
    loadSessions();
  </script>
</body>
</html>
