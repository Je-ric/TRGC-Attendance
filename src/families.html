<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#76213f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TRGC Attendance" />
  <link rel="manifest" href="assets/favicon_io/site.webmanifest" />
  <script src="js/pwa.js" defer></script>
  <title>Families — Church Attendance</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon_io/favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon_io/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_io/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon_io/apple-touch-icon.png" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/interface.css?v=20261028-5" />
</head>
<body class="families-page directory-page">

  <div class="main-wrap">

    <!-- Hero Banner -->
    <header class="hero-banner has-banner-image">
      <div aria-hidden="true">
        <div class="hero-glow hero-glow-a"></div>
        <div class="hero-glow hero-glow-b"></div>
      </div>
      <div class="hero-banner-inner">
        <div class="hero-top-row">
          <div class="hero-brand">
            <img src="assets/img/TRGC-Logo.png" alt="TRGC Logo" class="hero-logo" />
            <div>
              <p class="hero-brand-title">TRGC Attendance</p>
              <p class="hero-brand-sub">Church Management</p>
            </div>
          </div>
          <div class="hero-meta">
            <div class="hero-clock">
              <p id="heroClock">--:--:--</p>
              <p id="heroClockDate" class="hero-date">Loading...</p>
            </div>
          </div>
        </div>
        <div class="hero-greeting-section">
          <p class="hero-eyebrow" id="heroDate">Loading...</p>
          <h1 class="hero-greeting" id="heroGreeting" aria-label="Good Morning, Ka-TRGC">
            <span aria-hidden="true"><span class="accent">Good Morning</span>, Ka-TRGC</span>
          </h1>
        </div>
        <div class="hero-nav-scroll">
          <nav class="hero-nav" aria-label="Main navigation">
            <div class="hero-nav-glide"></div>
            <a href="index.html"      class="hero-nav-link"><i class='bx bxs-dashboard'></i> Dashboard</a>
            <a href="events.html"     class="hero-nav-link"><i class='bx bx-calendar-event'></i> Events</a>
            <a href="attendance.html" class="hero-nav-link"><i class='bx bx-check-square'></i> Attendance</a>
            <a href="people.html"     class="hero-nav-link"><i class='bx bx-group'></i> People</a>
            <a href="families.html"   class="hero-nav-link active" aria-current="page"><i class='bx bx-home-heart'></i> Families</a>
            <a href="reports.html"    class="hero-nav-link"><i class='bx bx-bar-chart-alt-2'></i> Reports</a>
          </nav>
        </div>
      </div>
    </header>

    <!-- Actions bar -->
    <div class="actions-bar">
      <div class="page-heading"><h2>Families</h2><p>Bring people together by household.</p></div>
      <button onclick="openAddModal()" class="btn btn-primary btn-sm"><i class='bx bx-home-plus'></i> Add Family</button>
    </div>

    <div class="filter-bar">
      <div class="search-wrap">
        <i class='bx bx-search'></i>
        <input aria-label="Search family name" id="searchInput" type="text" placeholder="Search family name…" />
      </div>
      <span id="countLabel" style="margin-left:auto;font-size:0.6875rem;color:var(--grey);letter-spacing:0.06em;text-transform:uppercase;font-weight:700"></span>
    </div>

    <main class="page-content">
      <div class="panel">
        <div id="familiesBody" class="directory-grid" aria-label="Families">
          <div class="empty-state"><i class="bx bx-loader-alt bx-spin"></i><p>Loading families…</p></div>
        </div>
        <div id="pagination"></div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Modal -->
  <dialog id="familyModal">
    <div class="modal-header">
      <span id="modalTitle" class="modal-title">Add Family</span>
      <button onclick="closeModal('familyModal')" class="modal-close"><i class='bx bx-x'></i></button>
    </div>
    <form id="familyForm" onsubmit="saveFamily(event)">
      <div class="modal-body">
        <input type="hidden" id="familyId" />
        <div class="space-y-3">
          <div>
            <label class="form-label">Family Name <span style="color:var(--red)">*</span></label>
            <input aria-label="Family Name *" id="fName" class="form-input" required placeholder="e.g. Santos Family" />
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
            <div>
              <label class="form-label">Contact Person</label>
              <input aria-label="Contact Person" id="fContactPerson" class="form-input" />
            </div>
            <div>
              <label class="form-label">Contact Number</label>
              <input aria-label="Contact Number" id="fContactNumber" class="form-input" />
            </div>
          </div>
          <div>
            <label class="form-label">Address</label>
            <input aria-label="Address" id="fAddress" class="form-input" />
          </div>
          <div>
            <label class="form-label">Barangay</label>
            <input aria-label="Barangay" id="fBarangay" class="form-input" />
          </div>
          <div>
            <label class="form-label">Notes</label>
            <textarea aria-label="Notes" id="fNotes" class="form-input" rows="2"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" onclick="closeModal('familyModal')" class="btn btn-ghost">Cancel</button>
        <button id="saveBtn" type="submit" class="btn btn-primary"><i class='bx bx-save'></i> Save</button>
      </div>
    </form>
  </dialog>

  <!-- View Modal -->
  <dialog id="viewModal" style="max-width:580px">
    <div class="modal-header">
      <div style="display:flex;align-items:center;gap:0.75rem">
        <div class="avatar-circle" id="viewAvatar"><i class='bx bx-home-heart' style="font-size:1.1rem"></i></div>
        <div>
          <div id="viewTitle" style="font-size:0.9375rem;font-weight:700"></div>
          <div style="font-size:0.6875rem;color:rgba(255,255,255,0.55);text-transform:uppercase;letter-spacing:0.08em">Family Details</div>
        </div>
      </div>
      <button onclick="closeModal('viewModal')" class="modal-close"><i class='bx bx-x'></i></button>
    </div>
    <div id="viewBody" class="modal-body"></div>
    <div class="modal-footer">
      <button onclick="closeModal('viewModal')" class="btn btn-ghost">Close</button>
      <button id="viewEditBtn" class="btn btn-primary"><i class='bx bx-edit'></i> Edit</button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js?v=20261028-2"></script>
  <script>
    initHeroBanner();
    
    const PAGE_SIZE = 15;
    let currentPage = 1;
    let allFamilies = [];

    async function loadFamilies() {
      const { data, error } = await db
        .from('families')
        .select('*, people(id, first_name, last_name, membership_status)')
        .order('family_name');
      if (error) {
        document.getElementById('familiesBody').innerHTML = '<div class="empty-state"><i class="bx bx-wifi-off"></i><p>Unable to load families.</p><button class="btn btn-outline" onclick="loadFamilies()">Retry</button></div>';
        return;
      }
      allFamilies = data || [];
      renderTable();
    }

    function filtered() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      return allFamilies.filter(f => !q || f.family_name.toLowerCase().includes(q));
    }

    function renderTable() {
      const data = filtered();
      const totalPages = Math.max(1, Math.ceil(data.length / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = 1;
      const slice = data.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
      document.getElementById('countLabel').textContent = `${data.length} famil${data.length !== 1 ? 'ies' : 'y'}`;
      const grid = document.getElementById('familiesBody');
      grid.innerHTML = slice.length ? slice.map(f => `<article class="family-card">
        <div class="directory-card-top"><i class="bx bx-home-heart directory-icon" aria-hidden="true"></i>
          <span class="badge" style="background:#eef3fa;color:#49628b">${f.people?.length ?? 0} members</span></div>
        <h3 class="directory-card-title">${escapeHtml(f.family_name)}</h3>
        <p class="directory-card-meta"><i class="bx bx-user" aria-hidden="true"></i>${escapeHtml(f.contact_person || 'No contact person')}</p>
        <p class="directory-card-meta"><i class="bx bx-phone" aria-hidden="true"></i>${escapeHtml(f.contact_number || 'No contact number')}</p>
        <p class="directory-card-meta"><i class="bx bx-map" aria-hidden="true"></i>${escapeHtml(f.barangay || 'No barangay specified')}</p>
        <div class="directory-card-footer">
          <button class="btn btn-outline btn-sm" data-family-action="view" data-id="${escapeHtml(f.id)}">View Family</button>
          <div class="directory-card-actions">
            <button class="btn btn-ghost btn-sm" data-family-action="edit" data-id="${escapeHtml(f.id)}" aria-label="Edit ${escapeHtml(f.family_name)}"><i class="bx bx-edit"></i></button>
            <button class="btn btn-danger btn-sm" data-family-action="delete" data-id="${escapeHtml(f.id)}" aria-label="Delete ${escapeHtml(f.family_name)}"><i class="bx bx-trash"></i></button>
          </div>
        </div>
      </article>`).join('') : '<div class="empty-state"><i class="bx bx-home-heart"></i><p>No families match your search.</p></div>';
      renderPagination(document.getElementById('pagination'), currentPage, totalPages, p => { currentPage = p; renderTable(); });
    }

    document.getElementById('familiesBody').addEventListener('click', event => {
      const button = event.target.closest('button[data-family-action]');
      if (!button) return;
      const family = allFamilies.find(f => f.id === button.dataset.id);
      if (!family) return;
      if (button.dataset.familyAction === 'view') viewFamily(family.id);
      if (button.dataset.familyAction === 'edit') editFamily(family.id);
      if (button.dataset.familyAction === 'delete') deleteFamily(family.id, family.family_name, family.people?.length ?? 0);
    });

    function openAddModal() {
      document.getElementById('modalTitle').textContent = 'Add Family';
      document.getElementById('familyForm').reset();
      document.getElementById('familyId').value = '';
      openModal('familyModal');
    }

    function editFamily(id) {
      const f = allFamilies.find(x => x.id === id);
      if (!f) return;
      document.getElementById('modalTitle').textContent = 'Edit Family';
      document.getElementById('familyId').value = f.id;
      document.getElementById('fName').value = f.family_name;
      document.getElementById('fContactPerson').value = f.contact_person || '';
      document.getElementById('fContactNumber').value = f.contact_number || '';
      document.getElementById('fAddress').value = f.address || '';
      document.getElementById('fBarangay').value = f.barangay || '';
      document.getElementById('fNotes').value = f.notes || '';
      openModal('familyModal');
    }

    async function saveFamily(e) {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      btn.disabled = true; btn.innerHTML = `<i class='bx bx-loader-alt bx-spin'></i> Saving…`;
      const id = document.getElementById('familyId').value;
      const payload = {
        family_name:    document.getElementById('fName').value.trim(),
        contact_person: document.getElementById('fContactPerson').value.trim() || null,
        contact_number: document.getElementById('fContactNumber').value.trim() || null,
        address:        document.getElementById('fAddress').value.trim() || null,
        barangay:       document.getElementById('fBarangay').value.trim() || null,
        notes:          document.getElementById('fNotes').value.trim() || null,
      };
      const { error } = id
        ? await db.from('families').update(payload).eq('id', id)
        : await db.from('families').insert(payload);
      btn.disabled = false; btn.innerHTML = `<i class='bx bx-save'></i> Save`;
      if (error) { showToast(error.message, 'error'); return; }
      showToast(id ? 'Family updated.' : 'Family added.');
      closeModal('familyModal');
      loadFamilies();
    }

    async function deleteFamily(id, name, memberCount) {
      const msg = memberCount > 0
        ? `Delete "${name}"? ${memberCount} member(s) will be unlinked from this family.`
        : `Delete "${name}"?`;
      if (!confirmDelete(msg)) return;
      const { error } = await db.from('families').delete().eq('id', id);
      if (error) { showToast(error.message, 'error'); return; }
      showToast('Family deleted.');
      loadFamilies();
    }

    function viewFamily(id) {
      const f = allFamilies.find(x => x.id === id);
      if (!f) return;
      document.getElementById('viewTitle').textContent = f.family_name;
      document.getElementById('viewEditBtn').onclick = () => { closeModal('viewModal'); editFamily(f.id); };
      document.getElementById('viewBody').innerHTML = `
        <div style="margin-bottom:1.25rem">
          ${infoRow('Contact Person', f.contact_person || '—', 'bx-user')}
          ${infoRow('Contact Number', f.contact_number || '—', 'bx-phone')}
          ${infoRow('Barangay', f.barangay || '—', 'bx-map')}
          ${infoRow('Address', f.address || '—', 'bx-map-pin')}
          ${f.notes ? infoRow('Notes', f.notes, 'bx-note') : ''}
        </div>
        <div style="border-top:1px solid var(--border);padding-top:1rem">
          <p style="font-size:0.625rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--grey);margin-bottom:0.75rem">
            Members (${f.people?.length ?? 0})
          </p>
          ${f.people?.length
            ? `<div style="display:flex;flex-direction:column;gap:0">
                ${f.people.map(p => `
                  <div style="display:flex;align-items:center;justify-content:space-between;padding:0.625rem 0;border-bottom:1px solid var(--light)">
                    <div style="display:flex;align-items:center;gap:0.625rem">
                      <div style="width:28px;height:28px;border-radius:50%;background:var(--light);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0">
                        <i class='bx bx-user' style="font-size:0.875rem;color:var(--grey)"></i>
                      </div>
                      <span style="font-size:0.8125rem;font-weight:600">${p.first_name} ${p.last_name}</span>
                    </div>
                    ${badge(p.membership_status, statusColors[p.membership_status] || '')}
                  </div>`).join('')}
              </div>`
            : `<div class="empty-state" style="padding:1.5rem">
                <i class='bx bx-user-x'></i>
                <p>No members linked to this family.</p>
              </div>`
          }
        </div>
      `;
      openModal('viewModal');
    }

    function infoRow(label, value, icon = '') {
      return `<div class="info-row"><span class="info-row-label">${icon ? `<i class='bx ${icon}'></i>` : ''}${label}</span><span class="info-row-value">${value}</span></div>`;
    }

    document.getElementById('searchInput').addEventListener('input', debounce(() => { currentPage = 1; renderTable(); }));

    if (new URLSearchParams(location.search).get('action') === 'create') {
      history.replaceState(null, '', location.pathname);
      window.addEventListener('load', openAddModal);
    }

    loadFamilies();
  </script>
</body>
</html>
