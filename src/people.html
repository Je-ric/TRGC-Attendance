<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>People — Church Attendance</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon_io/favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon_io/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_io/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon_io/apple-touch-icon.png" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <div class="main-wrap">

    <!-- Hero Banner -->
    <header class="hero-banner has-banner-image">
      <div aria-hidden="true">
        <div class="hero-glow hero-glow-a"></div>
        <div class="hero-glow hero-glow-b"></div>
      </div>
      <div class="hero-banner-inner">
        <div class="hero-top-row">
          <div class="hero-brand">
            <img src="assets/img/TRGC-Logo.png" alt="TRGC Logo" class="hero-logo" />
            <div>
              <p class="hero-brand-title">TRGC Attendance</p>
              <p class="hero-brand-sub">Church Management</p>
            </div>
          </div>
          <div class="hero-meta">
            <div class="hero-clock">
              <p id="heroClock">--:--:--</p>
              <p id="heroClockDate" class="hero-date">Loading...</p>
            </div>
          </div>
        </div>
        <div class="hero-greeting-section">
          <p class="hero-eyebrow" id="heroDate">Loading...</p>
          <h1 class="hero-greeting" id="heroGreeting" aria-label="Good Morning, Ka-TRGC">
            <span aria-hidden="true"><span class="accent">Good Morning</span>, Ka-TRGC</span>
          </h1>
        </div>
        <div class="hero-nav-scroll">
          <nav class="hero-nav" aria-label="Main navigation">
            <div class="hero-nav-glide"></div>
            <a href="index.html"      class="hero-nav-link"><i class='bx bxs-dashboard'></i> Dashboard</a>
            <a href="events.html"     class="hero-nav-link"><i class='bx bx-calendar-event'></i> Events</a>
            <a href="attendance.html" class="hero-nav-link"><i class='bx bx-check-square'></i> Attendance</a>
            <a href="people.html"     class="hero-nav-link active" aria-current="page"><i class='bx bx-group'></i> People</a>
            <a href="families.html"   class="hero-nav-link"><i class='bx bx-home-heart'></i> Families</a>
            <a href="reports.html"    class="hero-nav-link"><i class='bx bx-bar-chart-alt-2'></i> Reports</a>
          </nav>
        </div>
      </div>
    </header>

    <!-- Actions bar -->
    <div class="actions-bar">
      <button onclick="exportPeople()" class="btn btn-outline btn-sm"><i class='bx bx-download'></i> Export</button>
      <button onclick="autoCalculateCategories()" class="btn btn-outline btn-sm"><i class='bx bx-magic-wand'></i> Auto-Calc</button>
      <button onclick="openAddModal()" class="btn btn-primary btn-sm"><i class='bx bx-user-plus'></i> Add Person</button>
    </div>

    <!-- Filter bar -->
    <div class="filter-bar">
      <div class="search-wrap">
        <i class='bx bx-search'></i>
        <input id="searchInput" type="text" placeholder="Search name…" />
      </div>
      <select id="filterCategory" class="form-input" style="width:auto">
        <option value="">All Categories</option>
        <option>Kids</option><option>Youth</option><option>Adults</option><option>Seniors</option>
      </select>
      <select id="filterStatus" class="form-input" style="width:auto">
        <option value="">All Statuses</option>
        <option>Member</option><option>Regular Attendee</option><option>Visitor</option><option>Inactive</option>
      </select>
      <select id="filterGender" class="form-input" style="width:auto">
        <option value="">All Genders</option>
        <option>Male</option><option>Female</option>
      </select>
      <span id="countLabel" style="margin-left:auto;font-size:0.6875rem;color:var(--grey);letter-spacing:0.06em;text-transform:uppercase;font-weight:700;"></span>
    </div>

    <main class="page-content">
      <div class="panel">
        <div style="overflow-x:auto">
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Membership</th>
                <th>Age</th>
                <th>Family</th>
                <th>Contact</th>
                <th style="width:100px"></th>
              </tr>
            </thead>
            <tbody id="peopleBody">
              <tr><td colspan="7" style="text-align:center;padding:3rem;color:var(--grey)">
                <i class='bx bx-loader-alt bx-spin' style="font-size:1.5rem"></i>
              </td></tr>
            </tbody>
          </table>
        </div>
        <div id="pagination"></div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Modal -->
  <dialog id="personModal" style="max-width:560px">
    <div class="modal-header">
      <span id="modalTitle" class="modal-title">Add Person</span>
      <button onclick="closeModal('personModal')" class="modal-close"><i class='bx bx-x'></i></button>
    </div>
    <form id="personForm" onsubmit="savePerson(event)">
      <div class="modal-body">
        <input type="hidden" id="personId" />
        <div class="space-y-3">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
            <div>
              <label class="form-label">First Name <span style="color:var(--red)">*</span></label>
              <input id="fFirstName" class="form-input" required />
            </div>
            <div>
              <label class="form-label">Last Name <span style="color:var(--red)">*</span></label>
              <input id="fLastName" class="form-input" required />
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
            <div>
              <label class="form-label">Birthdate</label>
              <input id="fBirthdate" type="date" class="form-input" oninput="updateAutoCategory()" />
              <div id="ageDisplay" style="font-size:0.75rem;color:var(--grey);margin-top:0.25rem"></div>
            </div>
            <div>
              <label class="form-label">Gender</label>
              <select id="fGender" class="form-input">
                <option value="">—</option><option>Male</option><option>Female</option>
              </select>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
            <div>
              <label class="form-label">Civil Status</label>
              <select id="fCivilStatus" class="form-input">
                <option value="">—</option><option>Single</option><option>Married</option><option>Widowed</option><option>Separated</option>
              </select>
            </div>
            <div>
              <label class="form-label">Category <span id="autoCatHint" style="font-size:0.625rem;color:var(--red);font-weight:400;text-transform:none;letter-spacing:0"></span></label>
              <select id="fCategory" class="form-input">
                <option value="">Auto-calculate</option><option>Kids</option><option>Youth</option><option>Adults</option><option>Seniors</option>
              </select>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
            <div>
              <label class="form-label">Membership Status</label>
              <select id="fMembershipStatus" class="form-input">
                <option>Visitor</option><option>Member</option><option>Regular Attendee</option><option>Inactive</option>
              </select>
            </div>
            <div>
              <label class="form-label">Family</label>
              <select id="fFamilyId" class="form-input">
                <option value="">— None —</option>
              </select>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
            <div>
              <label class="form-label">Joined Date</label>
              <input id="fJoinedDate" type="date" class="form-input" />
            </div>
            <div>
              <label class="form-label">Date of Baptism</label>
              <input id="fBaptismDate" type="date" class="form-input" />
            </div>
          </div>
          <div>
            <label class="form-label">Address</label>
            <input id="fAddress" class="form-input" />
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
            <div>
              <label class="form-label">Contact Number</label>
              <input id="fContact" class="form-input" />
            </div>
            <div>
              <label class="form-label">Email</label>
              <input id="fEmail" type="email" class="form-input" />
            </div>
          </div>
          <div>
            <label class="form-label">Notes</label>
            <textarea id="fNotes" class="form-input" rows="2"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" onclick="closeModal('personModal')" class="btn btn-ghost">Cancel</button>
        <button id="saveBtn" type="submit" class="btn btn-primary"><i class='bx bx-save'></i> Save</button>
      </div>
    </form>
  </dialog>

  <!-- View Modal -->
  <dialog id="viewModal" style="max-width:600px">
    <div class="modal-header">
      <span id="viewName" class="modal-title">Person Details</span>
      <button onclick="closeModal('viewModal')" class="modal-close"><i class='bx bx-x'></i></button>
    </div>
    <div id="viewBody" class="modal-body"></div>
    <div class="modal-footer">
      <button onclick="closeModal('viewModal')" class="btn btn-ghost">Close</button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/export.js"></script>
  <script>
    initHeroBanner();
    const PAGE_SIZE = 15;
    let currentPage = 1;
    let allPeople = [];
    let families = [];

    async function loadFamilies() {
      const { data } = await db.from('families').select('id, family_name').order('family_name');
      families = data || [];
      const sel = document.getElementById('fFamilyId');
      families.forEach(f => {
        const o = document.createElement('option');
        o.value = f.id; o.textContent = f.family_name;
        sel.appendChild(o);
      });
    }

    async function loadPeople() {
      const { data, error } = await db
        .from('people')
        .select('*, families(family_name)')
        .order('last_name').order('first_name');
      if (error) { showToast('Failed to load people', 'error'); return; }
      allPeople = data || [];
      console.log('Loaded people data sample:', allPeople.slice(0, 3)); // Debug log
      renderTable();
    }

    function filteredPeople() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('filterCategory').value;
      const st = document.getElementById('filterStatus').value;
      const gender = document.getElementById('filterGender').value;
      return allPeople.filter(p => {
        const name = `${p.first_name} ${p.last_name}`.toLowerCase();
        const ec = effectiveCategory(p);
        return (!q || name.includes(q)) && (!cat || ec === cat) && (!st || p.membership_status === st) && (!gender || p.gender === gender);
      });
    }

    function renderTable() {
      const data = filteredPeople();
      const totalPages = Math.max(1, Math.ceil(data.length / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = 1;
      const slice = data.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

      document.getElementById('countLabel').textContent = `${data.length} record${data.length !== 1 ? 's' : ''}`;

      const tbody = document.getElementById('peopleBody');
      if (!slice.length) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:3rem;color:var(--grey)">
          <i class='bx bx-user-x' style="font-size:2rem;display:block;margin-bottom:0.5rem;color:var(--border)"></i>
          No people found.
        </td></tr>`;
      } else {
        tbody.innerHTML = slice.map(p => {
          const ec = effectiveCategory(p);
          const displayAge = p.age !== null ? p.age : calcAge(p.birthdate);
          
          // Gender circle indicator
          let genderCircle = '';
          if (p.gender === 'Male') {
            genderCircle = `<span style="display:inline-flex;align-items:center;justify-content:center;width:12px;height:12px;border-radius:50%;background:#3b82f6;margin-right:0.5rem" title="Male"></span>`;
          } else if (p.gender === 'Female') {
            genderCircle = `<span style="display:inline-flex;align-items:center;justify-content:center;width:12px;height:12px;border-radius:50%;background:#ec4899;margin-right:0.5rem" title="Female"></span>`;
          } else {
            genderCircle = `<span style="display:inline-flex;align-items:center;justify-content:center;width:12px;height:12px;border-radius:50%;background:#d1d5db;margin-right:0.5rem" title="Not specified"></span>`;
          }
          
          return `<tr>
            <td style="font-weight:600">${genderCircle}${p.last_name}, ${p.first_name}</td>
            <td>${badge(ec, categoryColors[ec] || '')}</td>
            <td>${badge(p.membership_status, statusColors[p.membership_status] || '')}</td>
            <td style="color:var(--grey)">${displayAge !== null ? displayAge : '—'}</td>
            <td style="color:var(--grey)">${p.families?.family_name ?? '—'}</td>
            <td style="color:var(--grey)">${p.contact_number || '—'}</td>
            <td>
              <div style="display:flex;gap:0.25rem;justify-content:flex-end">
                <button onclick="viewPerson('${p.id}')" class="btn btn-ghost btn-sm" title="View"><i class='bx bx-show'></i></button>
                <button onclick="editPerson('${p.id}')" class="btn btn-ghost btn-sm" title="Edit"><i class='bx bx-edit'></i></button>
                <button onclick="deletePerson('${p.id}', '${p.first_name} ${p.last_name}')" class="btn btn-danger btn-sm" title="Delete"><i class='bx bx-trash'></i></button>
              </div>
            </td>
          </tr>`;
        }).join('');
      }
      renderPagination(document.getElementById('pagination'), currentPage, totalPages, p => { currentPage = p; renderTable(); });
    }

    function updateAutoCategory() {
      const bd = document.getElementById('fBirthdate').value;
      const age = calcAge(bd);
      const categorySelect = document.getElementById('fCategory');
      const autoCatHint = document.getElementById('autoCatHint');
      const ageDisplay = document.getElementById('ageDisplay');

      if (age !== null) {
        const computedCategory = autoCategory(age);
        ageDisplay.textContent = `Age: ${age} years old`;
        autoCatHint.textContent = `(auto: ${computedCategory})`;

        // Auto-fill category if it's currently empty or "Auto-calculate"
        if (!categorySelect.value || categorySelect.value === '') {
          categorySelect.value = computedCategory;
        }
      } else {
        ageDisplay.textContent = '';
        autoCatHint.textContent = '';
      }
    }

    function openAddModal() {
      document.getElementById('modalTitle').textContent = 'Add Person';
      document.getElementById('personForm').reset();
      document.getElementById('personId').value = '';
      document.getElementById('autoCatHint').textContent = '';
      document.getElementById('ageDisplay').textContent = '';
      openModal('personModal');
    }

    function editPerson(id) {
      const p = allPeople.find(x => x.id === id);
      if (!p) return;
      document.getElementById('modalTitle').textContent = 'Edit Person';
      document.getElementById('personId').value = p.id;
      document.getElementById('fFirstName').value = p.first_name;
      document.getElementById('fLastName').value = p.last_name;
      document.getElementById('fBirthdate').value = p.birthdate || '';
      document.getElementById('fGender').value = p.gender || '';
      document.getElementById('fCivilStatus').value = p.civil_status || '';
      document.getElementById('fCategory').value = p.category || '';
      document.getElementById('fMembershipStatus').value = p.membership_status;
      document.getElementById('fFamilyId').value = p.family_id || '';
      document.getElementById('fJoinedDate').value = p.joined_date || '';
      document.getElementById('fBaptismDate').value = p.date_of_baptism || '';
      document.getElementById('fAddress').value = p.address || '';
      document.getElementById('fContact').value = p.contact_number || '';
      document.getElementById('fEmail').value = p.email || '';
      document.getElementById('fNotes').value = p.notes || '';
      updateAutoCategory();
      openModal('personModal');
    }

    async function savePerson(e) {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      btn.disabled = true; btn.innerHTML = '<i class=\'bx bx-loader-alt bx-spin\'></i> Saving…';

      const id = document.getElementById('personId').value;
      const firstName = document.getElementById('fFirstName').value.trim();
      const lastName = document.getElementById('fLastName').value.trim();
      const birthdate = document.getElementById('fBirthdate').value || null;
      const age = calcAge(birthdate);

      // Check for duplicate person (same first and last name)
      const duplicate = allPeople.find(p => 
        p.first_name.toLowerCase() === firstName.toLowerCase() && 
        p.last_name.toLowerCase() === lastName.toLowerCase() &&
        p.id !== id // Exclude current person when editing
      );

      if (duplicate) {
        btn.disabled = false; btn.innerHTML = '<i class=\'bx bx-save\'></i> Save';
        showToast(`A person named "${firstName} ${lastName}" already exists.`, 'error');
        return;
      }

      const payload = {
        first_name:        firstName,
        last_name:         lastName,
        birthdate:         birthdate,
        age:               age,
        gender:            document.getElementById('fGender').value || null,
        civil_status:      document.getElementById('fCivilStatus').value || null,
        category:          document.getElementById('fCategory').value || null,
        membership_status: document.getElementById('fMembershipStatus').value,
        family_id:         document.getElementById('fFamilyId').value || null,
        joined_date:       document.getElementById('fJoinedDate').value || null,
        date_of_baptism:   document.getElementById('fBaptismDate').value || null,
        address:           document.getElementById('fAddress').value.trim() || null,
        contact_number:    document.getElementById('fContact').value.trim() || null,
        email:             document.getElementById('fEmail').value.trim() || null,
        notes:             document.getElementById('fNotes').value.trim() || null,
      };

      const { error } = id
        ? await db.from('people').update(payload).eq('id', id)
        : await db.from('people').insert(payload);

      btn.disabled = false; btn.innerHTML = '<i class=\'bx bx-save\'></i> Save';
      if (error) { showToast(error.message, 'error'); return; }
      showToast(id ? 'Person updated.' : 'Person added.');
      closeModal('personModal');
      loadPeople();
    }

    async function deletePerson(id, name) {
      if (!confirmDelete(`Delete ${name}? This will also remove their attendance records.`)) return;
      const { error } = await db.from('people').delete().eq('id', id);
      if (error) { showToast(error.message, 'error'); return; }
      showToast('Person deleted.');
      loadPeople();
    }

    async function viewPerson(id) {
      const p = allPeople.find(x => x.id === id);
      if (!p) return;
      const displayAge = p.age !== null ? p.age : calcAge(p.birthdate);
      const ec = effectiveCategory(p);

      const { data: records } = await db
        .from('attendance_records')
        .select('status, created_at, attendance_sessions(date, service_name, attendance_types(name))')
        .eq('person_id', id)
        .order('created_at', { ascending: false })
        .limit(10);

      document.getElementById('viewName').textContent = `${p.first_name} ${p.last_name}`;
      document.getElementById('viewBody').innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1.25rem">
          ${infoRow('Birthdate', p.birthdate ? formatDate(p.birthdate) : '—')}
          ${infoRow('Age', displayAge !== null ? `${displayAge} years old` : '—')}
          ${infoRow('Gender', p.gender || '—')}
          ${infoRow('Civil Status', p.civil_status || '—')}
          ${infoRow('Category', badge(ec, categoryColors[ec] || ''))}
          ${infoRow('Membership', badge(p.membership_status, statusColors[p.membership_status] || ''))}
          ${infoRow('Family', p.families?.family_name || '—')}
          ${infoRow('Contact Number', p.contact_number || '—')}
          ${infoRow('Email', p.email || '—')}
          ${infoRow('Joined Date', p.joined_date ? formatDate(p.joined_date) : '—')}
          ${infoRow('Date of Baptism', p.date_of_baptism ? formatDate(p.date_of_baptism) : '—')}
          <div style="grid-column:1/-1">${infoRow('Address', p.address || '—')}</div>
          ${p.notes ? `<div style="grid-column:1/-1">${infoRow('Notes', p.notes)}</div>` : ''}
        </div>
        <div style="border-top:1px solid var(--border);padding-top:1rem">
          <p style="font-size:0.625rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--grey);margin-bottom:0.75rem">Recent Attendance</p>
          ${records?.length ? `<table class="data-table">
            <thead><tr><th>Date</th><th>Event</th><th>Status</th></tr></thead>
            <tbody>${records.map(r => `<tr>
              <td>${formatDate(r.attendance_sessions?.date)}</td>
              <td>${r.attendance_sessions?.attendance_types?.name ?? '—'}${r.attendance_sessions?.service_name ? ' &middot; ' + r.attendance_sessions.service_name : ''}</td>
              <td>${badge(r.status, r.status === 'present' ? 'background:#dcfce7;color:#166534' : 'background:#fee2e2;color:#991b1b')}</td>
            </tr>`).join('')}</tbody>
          </table>` : '<p style="color:var(--grey);font-size:0.8125rem">No attendance records yet.</p>'}
        </div>
      `;
      openModal('viewModal');
    }

    function infoRow(label, value) {
      return `<div>
        <p style="font-size:0.625rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--grey);margin-bottom:0.2rem">${label}</p>
        <p style="font-size:0.8125rem;color:var(--black)">${value}</p>
      </div>`;
    }

    async function autoCalculateCategories() {
      if (!confirm('This will overwrite the category and age for all people based on their birthdate. Continue?')) return;

      const updates = [];
      const debugInfo = [];

      allPeople.forEach(p => {
        const age = calcAge(p.birthdate);
        const computedCategory = autoCategory(age) || 'Adults'; // Default to Adults if no birthdate

        // Debug logging
        debugInfo.push({
          name: `${p.first_name} ${p.last_name}`,
          birthdate: p.birthdate,
          computedAge: age,
          computedCategory: computedCategory,
          currentCategory: p.category,
          currentAge: p.age,
          categoryMatch: p.category === computedCategory,
          ageMatch: p.age === age,
          needsUpdate: p.category !== computedCategory || p.age !== age
        });

        // Update if category differs or age differs
        if (p.category !== computedCategory || p.age !== age) {
          updates.push({ id: p.id, category: computedCategory, age: age });
        }
      });

      console.log('Debug Info:', debugInfo);
      console.log('Sample debug info (first 5):', debugInfo.slice(0, 5));
      console.log('Updates to process:', updates.length);

      if (updates.length === 0) {
        showToast('All categories and ages are already correct based on birthdate.', 'info');
        console.log('No updates needed. Sample of current vs computed:');
        debugInfo.slice(0, 5).forEach(d => {
          console.log(`${d.name}: birthdate=${d.birthdate}, age=${d.currentAge}→${d.computedAge}, category=${d.currentCategory}→${d.computedCategory}`);
        });
        return;
      }

      // Process updates individually to ensure correct category/age per person
      let successCount = 0;
      for (const update of updates) {
        const { error } = await db.from('people')
          .update({ category: update.category, age: update.age })
          .eq('id', update.id);
        if (error) {
          showToast(`Error updating record: ${error.message}`, 'error');
          console.error('Update error:', error);
          return;
        }
        successCount++;
      }

      showToast(`Updated ${successCount} records with categories and ages based on birthdate.`);
      console.log(`Successfully updated ${successCount} records`);
      loadPeople();
    }

    async function exportPeople() {
      const btn = document.querySelector('button[onclick="exportPeople()"]');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class=\'bx bx-loader-alt bx-spin\'></i> Exporting…';

      try {
        const people = await fetchAllPeopleForExport();
        if (people) {
          await exportPeopleToCSV(people);
        }
      } catch (error) {
        showToast('Export failed: ' + error.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

    // Init
    const debouncedRender = debounce(() => { currentPage = 1; renderTable(); });
    document.getElementById('searchInput').addEventListener('input', debouncedRender);
    document.getElementById('filterCategory').addEventListener('change', debouncedRender);
    document.getElementById('filterStatus').addEventListener('change', debouncedRender);
    document.getElementById('filterGender').addEventListener('change', debouncedRender);

    if (new URLSearchParams(location.search).get('action') === 'create') {
      history.replaceState(null, '', location.pathname);
      window.addEventListener('load', openAddModal);
    }

    loadFamilies();
    loadPeople();
  </script>
</body>
</html>
