<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#76213f" />
    <title>Offline — TRGC Attendance</title>
    <style>
        body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font: 1rem/1.6 system-ui, sans-serif; background: #f5f7fb; color: #202c40; }
        main { max-width: 30rem; padding: 2rem; }
        h1 { line-height: 1.2; }
        a { display: inline-block; margin: 0.5rem 0.75rem 0.5rem 0; padding: 0.75rem 1rem; border-radius: 0.5rem; background: #76213f; color: white; text-decoration: none; }
        a:focus-visible { outline: 3px solid #202c40; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <h1>You’re offline</h1>
        <p>Connect to the internet to open TRGC Attendance and load or save records.</p>
        <p>Offline changes are not saved or queued. If you have unsaved attendance in another open tab, keep that tab open and save when your connection returns.</p>
        <a href="">Try again</a>
        <a id="dashboard-link" href="../index.html">Go to Dashboard</a>
    </main>
    <script>
        const worker = navigator.serviceWorker?.controller;
        if (worker) {
            document.getElementById('dashboard-link').href = new URL('index.html', worker.scriptURL).href;
        }
    </script>
</body>
</html>
